name: JDCloud-ImmortalWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/immortalwrt.git
      repo_branch: openwrt-25.12
      config_file: configs/JDCloud.config
      firmware_tag: JDCloud
      kernel_file: kernel-6.18
      artifact_prefix: Athena
      manifest_file: immortalwrt-qualcommax-ipq60xx.manifest
      delete_old_workflows: true
      release_summary: >-
        这是开启全功能NSS的6.18内核固件，目标设备为京东云雅典娜AX6600（jdcloud_re-cs-02），默认主题为Aurora。
        本固件在ImmortalWrt的基础上内置了kmod-tun、kmod-veth、kmod-nft-queue三个内核模块（用于解决open-box在线安装kmod失败的问题），
        并保留雅典娜点阵屏支持（athena-led）、ZRAM内存压缩、samba4文件共享，
        以及常用命令行工具（nano、htop、tmux、dmesg、autocore、openssh-sftp-server、zoneinfo-asia）；
        已精简掉PassWall、OpenList、磁盘存储组、网络服务与远程访问等插件，具体详见JDCloud.config和General.config。
